<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Auction platform architecture</title>
  <desc id="desc">The browser calls Express over REST and Socket.IO. PostgreSQL is the source of truth. Redis caches reads and carries Socket.IO Pub/Sub between API processes.</desc>
  <rect width="920" height="460" fill="#fafafa"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#18181b">
    <rect x="40" y="170" width="150" height="72" rx="8" fill="#fff" stroke="#18181b"/>
    <text x="115" y="200" text-anchor="middle" font-weight="600">Browser</text>
    <text x="115" y="222" text-anchor="middle" font-size="12" fill="#52525b">Next.js</text>

    <rect x="300" y="40" width="200" height="88" rx="8" fill="#fff" stroke="#18181b"/>
    <text x="400" y="74" text-anchor="middle" font-weight="600">API process</text>
    <text x="400" y="96" text-anchor="middle" font-size="12" fill="#52525b">Express + Socket.IO</text>
    <text x="400" y="114" text-anchor="middle" font-size="12" fill="#52525b">one or more instances</text>

    <rect x="640" y="28" width="230" height="100" rx="8" fill="#fff" stroke="#18181b"/>
    <text x="755" y="62" text-anchor="middle" font-weight="600">PostgreSQL</text>
    <text x="755" y="84" text-anchor="middle" font-size="12" fill="#52525b">source of truth</text>
    <text x="755" y="104" text-anchor="middle" font-size="12" fill="#52525b">row lock on each bid</text>

    <rect x="640" y="176" width="230" height="116" rx="8" fill="#fff" stroke="#18181b"/>
    <text x="755" y="210" text-anchor="middle" font-weight="600">Redis</text>
    <text x="755" y="232" text-anchor="middle" font-size="12" fill="#52525b">cache-aside for reads</text>
    <text x="755" y="252" text-anchor="middle" font-size="12" fill="#52525b">Pub/Sub for Socket.IO</text>
    <text x="755" y="272" text-anchor="middle" font-size="12" fill="#52525b">keys deleted after a write</text>

    <path d="M190 188 H300" stroke="#18181b" fill="none" marker-end="url(#arrow)"/>
    <text x="245" y="180" text-anchor="middle" font-size="12">REST</text>
    <path d="M190 224 H300" stroke="#18181b" fill="none" marker-end="url(#arrow)"/>
    <text x="245" y="246" text-anchor="middle" font-size="12">Socket.IO</text>

    <path d="M500 70 H640" stroke="#18181b" fill="none" marker-end="url(#arrow)"/>
    <text x="570" y="62" text-anchor="middle" font-size="12">writes and misses</text>
    <path d="M500 110 H640" stroke="#18181b" fill="none" marker-end="url(#arrow)"/>
    <path d="M500 210 H640" stroke="#18181b" fill="none" marker-end="url(#arrow)"/>
    <text x="570" y="202" text-anchor="middle" font-size="12">cache and adapter</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#18181b"/>
    </marker>
  </defs>
</svg>
